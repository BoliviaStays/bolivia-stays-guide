name: Actualizar disponibilidad y tipo de cambio

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Actualizar datos públicos
        env:
          AIRBNB_ICAL_7E: ${{ secrets.AIRBNB_ICAL_7E }}
          AIRBNB_ICAL_11F: ${{ secrets.AIRBNB_ICAL_11F }}
        run: node reservar/scripts/update-data.mjs
      - name: Guardar cambios
        run: |
          if git diff --quiet -- reservar/data; then
            echo "No hay cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reservar/data
          git commit -m "chore: actualizar disponibilidad y tipo de cambio"
          git push
